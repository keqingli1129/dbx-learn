[project]
name = "smart_claims"
version = "0.0.1"
authors = [{ name = "keqingli1129@gmail.com" }]
# `bundle init` set this to match the local interpreter (3.12). Serverless environment_version 5
# is Python 3.12.3, but the default notebook environment is 3.11.10 (research R1, R15). pip
# enforces requires-python when the wheel is installed, so a >=3.12 pin would fail on the latter
# -- after a successful deploy, before any of our code runs. Widened to cover both.
requires-python = ">=3.11,<3.13"
# DELIBERATELY EMPTY. Anything listed here is declared as `Requires-Dist` in the wheel, so every
# consumer installs it -- including the seeding job and the pipelines, which need none of the
# app's web stack. Keeping this empty means the wheel installs with zero PyPI round-trips, and
# each workload asks only for what it actually uses via the extras below.
#
# Pipeline dependencies never belong here either: the scaffold warns they are cached during
# development, so they go in each pipeline's `environment` block instead (research R11).
dependencies = []

[project.optional-dependencies]
# The FastAPI claims portal (T096-T101). Installed as `smart_claims[app]`.
app = [
    "fastapi",
    "uvicorn",
    "python-multipart",   # multipart/form-data image upload
    "databricks-sdk",
]

# Declared as EXTRAS, not a PEP 735 [dependency-groups] block. The scaffold used the latter,
# which `uv sync --dev` understands but `pip install --group` only supports from pip 25.1; the
# system pip here is 24.0. Extras work on every pip, so `pip install -e '.[dev]'` is portable.
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    # Matched to the workspace's serverless runtime (Spark 4.2.0, environment version 5), not to
    # the scaffold's default of 16.4 which targets Spark 3.5. Used only by tests/integration/,
    # which are marked `workspace`; tests/unit/ must import nothing from here (Constitution I).
    "databricks-connect~=18.0.0",
    "build",   # `python -m build --wheel`, used by the bundle's artifacts block
]

# No [project.scripts]. The scaffold declared `main = "smart_claims.main:main"`, but T002 deleted
# main.py with the rest of the demo, which would have installed a broken console script.
#
# No `databricks-dlt` dev dependency either: it provides the LEGACY `dlt` module, which
# Constitution VI forbids. The modern API is `from pyspark import pipelines as dp`, which ships
# with databricks-connect.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Two suites, separated by a marker (Constitution I):
#   tests/unit/        pure Python, no Spark, no workspace -- this is SC-016
#   tests/integration/ marked `workspace`, needs a live profile
#
# The default run EXCLUDES the workspace suite, so `pytest` is always safe offline.
# Because addopts are prepended to the command line, a later `-m workspace` overrides
# this -- naming an integration file alone is NOT enough, the marker must be re-selected.
addopts = "-m 'not workspace' --strict-markers"

markers = [
    "workspace: requires a live Databricks workspace and a configured CLI profile; excluded by default, select with -m workspace",
]

[tool.ruff]
line-length = 120
