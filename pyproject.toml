[project]
name = "smart_claims"
version = "0.0.1"
authors = [{ name = "keqingli1129@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Runtime dependencies of the FastAPI claims portal and the setup/ml job code.
    #
    # NOT pipeline dependencies. The scaffold's warning applies: for pipelines, dependencies
    # declared here are cached during development -- declare them in the `environment` section
    # of each pipeline.yml instead (research R11). torch/torchvision/mlflow therefore do NOT
    # belong here; they go on the ML job's environment (T076).
    "fastapi",
    "uvicorn",
    "python-multipart",   # multipart/form-data image upload
    "databricks-sdk",
]

# Declared as an EXTRA, not a PEP 735 [dependency-groups] block. The scaffold used the latter,
# which `uv sync --dev` understands but `pip install --group` only supports from pip 25.1; the
# system pip here is 24.0. An extra works on every pip, so `pip install -e '.[dev]'` is portable.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    # Matched to the workspace's serverless runtime (Spark 4.2.0, environment version 5), not to
    # the scaffold's default of 16.4 which targets Spark 3.5. Used only by tests/integration/,
    # which are marked `workspace`; tests/unit/ must import nothing from here (Constitution I).
    "databricks-connect~=18.0.0",
]

# No [project.scripts]. The scaffold declared `main = "smart_claims.main:main"`, but T002 deleted
# main.py with the rest of the demo, which would have installed a broken console script.
#
# No `databricks-dlt` dev dependency either: it provides the LEGACY `dlt` module, which
# Constitution VI forbids. The modern API is `from pyspark import pipelines as dp`, which ships
# with databricks-connect.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Two suites, separated by a marker (Constitution I):
#   tests/unit/        pure Python, no Spark, no workspace -- this is SC-016
#   tests/integration/ marked `workspace`, needs a live profile
#
# The default run EXCLUDES the workspace suite, so `pytest` is always safe offline.
# Because addopts are prepended to the command line, a later `-m workspace` overrides
# this -- naming an integration file alone is NOT enough, the marker must be re-selected.
addopts = "-m 'not workspace' --strict-markers"

markers = [
    "workspace: requires a live Databricks workspace and a configured CLI profile; excluded by default, select with -m workspace",
]

[tool.ruff]
line-length = 120
