# This is a Declarative Automation Bundle definition for smart_claims.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: smart_claims
  uuid: f585cb5e-3f3f-4ac0-997c-b2638c9ea25c

include:
  - resources/*.yml

# Only ship what serverless compute actually needs. Without this, `bundle deploy` uploads every
# file git does not ignore -- specs, tests, editor config, agent config -- and re-syncs them on
# every deploy. Of 76 tracked files, 15 are under src/.
#
# What MUST stay synced:
#   src/           pipeline dataset files and job code
#   pyproject.toml required by `--editable ${workspace.file_path}`; without it pip cannot
#                  install the project and `import smart_claims.lib` fails at runtime
sync:
  exclude:
    - docs/**          # specs, plan, research -- read by humans, not by compute
    - tests/**         # the offline suite runs locally; integration tests use databricks-connect
    - fixtures/**      # test fixtures, loaded by the local suite only
    - .specify/**      # spec-kit tooling
    - .claude/**       # agent configuration
    - .vscode/**       # editor settings (tracked in git on purpose, but useless in the workspace)
    - run-tests.sh     # local test wrapper
    - bootstrap.sh     # run locally, before the first deploy

# No `artifacts:` block. The template builds a wheel with `uv build --wheel`,
# which is the only step in the bundle that requires uv. Pipelines instead
# install this project with `--editable ${workspace.file_path}` (research R11),
# so no wheel is needed and the bundle deploys with the CLI alone.

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

  speed_threshold:
    description: >-
      Speed above which the telematics check fails a claim, in the units the source emits.
      A business rule, not an environment setting, so it carries a default rather than a
      per-target assignment. The triage rule reads it, so retuning needs no code change.
    default: 45

  warehouse_id:
    description: >-
      SQL warehouse backing the AI/BI dashboard and the app's warehouse-backed repository.
      Resolved by NAME rather than hardcoded, so the bundle is portable across workspaces
      where the id differs.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
    variables:
      # Each target owns its own catalog; bootstrap.sh creates whichever one the target names.
      catalog: smart_claims_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/keqingli1129@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/keqingli1129@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      # A separate catalog per target. Isolation is therefore at the CATALOG level here, with
      # mode: production leaving schema names unprefixed -- smart_claims_prod.bronze.claim.
      # The dev target isolates one level down instead, via development mode's dev_<user>_
      # schema prefix (research R13).
      catalog: smart_claims_prod
      schema: prod
    permissions:
      - user_name: keqingli1129@gmail.com
        level: CAN_MANAGE
