# This is a Declarative Automation Bundle definition for smart_claims.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: smart_claims
  uuid: f585cb5e-3f3f-4ac0-997c-b2638c9ea25c

include:
  - resources/*.yml

# No `artifacts:` block. The template builds a wheel with `uv build --wheel`,
# which is the only step in the bundle that requires uv. Pipelines instead
# install this project with `--editable ${workspace.file_path}` (research R11),
# so no wheel is needed and the bundle deploys with the CLI alone.

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
    variables:
      catalog: smart_claims_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/keqingli1129@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/keqingli1129@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: smart_claims_dev
      schema: prod
    permissions:
      - user_name: keqingli1129@gmail.com
        level: CAN_MANAGE
