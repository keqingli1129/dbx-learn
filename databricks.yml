# Smart Claims — end-to-end insurance lakehouse
# Every workspace asset is declared here or under resources/ (Constitution IV).

bundle:
  name: smart_claims
  uuid: 83ca2a4c-a2f1-4464-bec4-597a0296214c

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that owns all five Smart Claims schemas.
    default: smart_claims_dev

  speed_threshold:
    description: >-
      Speed above which the telematics check fails, in the units the source emits.
      Expressed as a variable so the triage rule can be retuned without code changes.
    default: 45

  warehouse_id:
    description: SQL warehouse backing the dashboard and the app's warehouse repository.
    default: cdcb7003ae7dd5ab # Serverless Starter Warehouse

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
